<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026학년도 과학 신문 만들기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>2026학년도 과학 신문 만들기</h1>
    </header>

    <main class="gallery-container">
        <figure class="gallery-item">
            <img src="images/1.jpg" alt="1.jpg">
            <figcaption>1.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/2.jpg" alt="2.jpg">
            <figcaption>2.jpg</figcaption>
        </figure>
        <figure class="gallery-item">

        </figure>
        <figure class="gallery-item">
            <img src="images/4.jpg" alt="4.jpg">
            <figcaption>4.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/5.jpg" alt="5.jpg">
            <figcaption>5.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/6.jpg" alt="6.jpg">
            <figcaption>6.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/7.jpg" alt="7.jpg">
            <figcaption>7.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/8.jpg" alt="8.jpg">
            <figcaption>8.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/9.jpg" alt="9.jpg">
            <figcaption>9.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/10.jpg" alt="10.jpg">
            <figcaption>10.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/11.jpg" alt="11.jpg">
            <figcaption>11.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/12.jpg" alt="12.jpg">
            <figcaption>12.jpg</figcaption>
        </figure>
        <figure class="gallery-item">
            <img src="images/13.jpg" alt="13.jpg">
            <figcaption>13.jpg</figcaption>
        </figure>
    </main>

    <div id="imageModal" class="modal">
        <span class="close">&times;</span>
        <div id="modalCaption" class="modal-caption"></div>
        <img class="modal-content" id="expandedImg">
    </div>

    <script src="script.js"></script>
</body>
</html>
